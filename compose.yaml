services:
  network-search:
    build: .
    restart: unless-stopped
    ports:
      - "8098:8080"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
    networks:
      default:
      farley-api:
        aliases:
          - farley-file

networks:
  farley-api:
    external: true
