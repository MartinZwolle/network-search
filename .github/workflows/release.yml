name: Publish Farley File 1.0.0
on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax and unit tests
        env:
          DATA_DIR: /tmp/farley-release-test
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
      - name: Verify version
        run: |
          grep -F 'APP_VERSION = "1.0.0"' app/main.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "GitHub release v1.0.0 already exists."
            exit 0
          fi
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "Farley File 1.0.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
